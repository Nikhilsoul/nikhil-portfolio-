<!DOCTYPE html>
<html>
<head>
	<title>Contact Us</title></head>
<div class="container"> 
  <link rel="stylesheet" 
  href="connect.css" type="text/css">
  <body>
    <form id="contact-form" action="https://formsubmit.co/nikhilkumar4714@gmail.com" method="post">
      <h3>Quick Contact</h3>
      <h4>Contact us today, and get reply with in 24 hours!</h4>
      <input type="hidden" name="_subject" value="New portfolio contact request">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <fieldset>
        <input name="First Name" placeholder="First Name" type="text" tabindex="1" required autofocus>
      </fieldset>
      <fieldset>
        <input name="Last Name" placeholder="Last Name" type="text" tabindex="2" required>
      </fieldset>
      <fieldset>
        <input name="Email Address" placeholder="Your Email Address" type="email" tabindex="3" required>
      </fieldset>
      <fieldset>
        <input name="Phone Number" placeholder="Your Phone Number" type="tel" tabindex="4" required>
      </fieldset>
      <fieldset>
        <textarea name="Message" placeholder="Type your Message Here...." tabindex="5" required></textarea>
      </fieldset>
      <fieldset>
        <button name="submit" type="submit" id="contact-submit" data-submit="...Sending">Submit</button>
      </fieldset>
    </form>
   
    
  </div>
  </body>
</html>
